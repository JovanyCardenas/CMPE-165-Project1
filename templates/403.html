{% extends "base.html" %}

{% block title %}Access Denied | Expense Tracker{% endblock %}

{% block content %}

<div class="flex min-h-[60vh] items-center justify-center">

    <div class="max-w-lg text-center">

        <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-red-100 dark:bg-red-500/20 text-red-600 dark:text-red-400">

            <svg
                class="h-8 w-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3Z"
                />
            </svg>

        </div>

        <p class="text-sm font-semibold uppercase tracking-wider text-red-600 dark:text-red-400">
            Error 403
        </p>

        <h1 class="mt-3 text-4xl font-bold tracking-tight text-slate-900 dark:text-slate-100">
            Access denied
        </h1>

        <p class="mx-auto mt-4 max-w-md text-base leading-7 text-slate-600 dark:text-slate-400">
            You don't have permission to access this page.
        </p>


        <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">

            {% if user.is_authenticated %}

                <a
                    href="{% url 'expenses:dashboard' %}"
                    class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700"
                >
                    Go to Dashboard
                </a>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700"
                >
                    Log In
                </a>

            {% endif %}

            <a
                href="{% url 'home' %}"
                class="rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-5 py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-300 shadow-sm transition hover:bg-slate-50 dark:hover:bg-slate-800"
            >
                Go Home
            </a>

        </div>

    </div>

</div>

{% endblock %}
